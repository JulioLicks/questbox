name: questbox
description: "Jogo e metodologia visual de criação de projetos, planejamento, desafios."
publish_to: 'none'

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  
  # State Management
  provider: ^6.4.0
  
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_app_check: ^0.2.0
  
  # Google AI
  google_generative_ai: ^0.4.0
  
  # HTTP & Networking
  http: ^1.2.0
  dio: ^5.4.0
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Navigation & Routing
  go_router: ^14.0.0
  
  # Storage
  shared_preferences: ^2.3.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # UI/UX
  google_fonts: ^7.0.0
  cached_network_image: ^3.4.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/CustomFont-Regular.ttf
        - asset: assets/fonts/CustomFont-Bold.ttf
          weight: 700
